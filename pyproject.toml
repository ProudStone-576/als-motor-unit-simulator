[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mndsim"
version = "0.2.0"
description = "Mechanistic motor-unit degeneration simulator for ALS/MND: virtual patients, counterfactual treatments and in-silico trials."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Taranjeet Singh Matharu" }]
keywords = [
    "ALS",
    "motor neuron disease",
    "motor unit",
    "neurodegeneration",
    "computational neuroscience",
    "in-silico trials",
    "disease progression modelling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
mndsim = "mndsim.cli:main"

[project.urls]
Homepage = "https://github.com/ProudStone-576/motor-unit-degeneration-simulator"
Issues = "https://github.com/ProudStone-576/motor-unit-degeneration-simulator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mndsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:mndsim.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
"examples/*" = ["E402"]
